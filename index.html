<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Roland</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial;
  background: linear-gradient(180deg, #eef3ff 0%, #ffffff 60%);
  color: #1a1a1a;
}

/* 主视觉 */
.hero {
  padding: 80px 24px 40px;
  max-width: 900px;
}

.hero h1 {
  font-size: 42px;
  margin: 0 0 10px;
  color: #1e3a8a;
}

.hero p {
  font-size: 16px;
  color: #5c6b8a;
}

/* 导航 */
nav {
  padding: 0 24px 30px;
}

nav a {
  margin-right: 20px;
  text-decoration: none;
  color: #4f6df5;
  font-weight: 500;
}

/* 内容区 */
.container {
  max-width: 900px;
  padding: 20px 24px 80px;
}

/* 目录标题 */
.section-title {
  font-size: 14px;
  color: #7a8ab0;
  margin-bottom: 20px;
  letter-spacing: 1px;
}

/* 列表项 */
.item {
  padding: 20px;
  margin-bottom: 14px;
  border-radius: 12px;
  background: white;
  box-shadow: 0 10px 30px rgba(60, 90, 200, 0.08);
  transition: 0.2s;
}

.item:hover {
  transform: translateY(-4px);
  box-shadow: 0 20px 40px rgba(60, 90, 200, 0.12);
}

.item a {
  text-decoration: none;
  color: #1e40af;
  font-size: 18px;
  font-weight: 500;
}

</style>
</head>

<body>

<div class="hero">
  <h1>Roland</h1>
  <p>一个正在构建中的个人网站</p>
</div>

<nav>
  <a href="#">首页</a>
</nav>

<div class="container">

  <div class="section-title">目录</div>

  <div class="item">
    <a href="page1.html">我的第一篇页面</a>
  </div>

  <div class="item">
    <a href="page2.html">学习记录</a>
  </div>

</div>

</body>
</html>
