<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Roland</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial;
      background: linear-gradient(to bottom, #eef4ff, #ffffff);
      color: #1a1a1a;
    }

    /* 顶部 */
    header {
      padding: 48px 24px 16px;
      font-size: 30px;
      font-weight: 600;
      color: #1f3fb7;
      letter-spacing: 0.5px;
    }

    /* 导航 */
    nav {
      padding: 0 24px 20px;
      font-size: 14px;
      color: #6b7aa8;
    }

    nav a {
      text-decoration: none;
      color: #5c6dd8;
      margin-right: 18px;
    }

    /* 主体容器 */
    .container {
      max-width: 720px;
      padding: 30px 24px 60px;
    }

    /* 标题 */
    h2 {
      font-size: 14px;
      font-weight: 600;
      color: #7c8db5;
      margin-bottom: 18px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* 列表 */
    .item {
      padding: 16px 18px;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(180, 200, 255, 0.2);
      border-radius: 10px;
      backdrop-filter: blur(6px);
      transition: all 0.2s ease;
    }

    .item:hover {
      background: rgba(230, 240, 255, 0.9);
      border-color: rgba(120, 150, 255, 0.3);
      transform: translateY(-2px);
    }

    .item a {
      text-decoration: none;
      color: #1f4ed8;
      font-size: 16px;
      font-weight: 500;
    }

    /* 微妙分割 */
    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, #dbe5ff, transparent);
      margin: 10px 0 20px;
    }

  </style>
</head>

<body>

<header>
  Roland
</header>

<nav>
  <a href="#">首页</a>
</nav>

<div class="container">

  <h2>目录</h2>

  <div class="divider"></div>

  <div class="item">
    <a href="page1.html">我的第一篇页面</a>
  </div>

  <div class="item">
    <a href="page2.html">学习记录</a>
  </div>

</div>

</body>
</html>
